name: Missed-run alarm

# A SEPARATE workflow, for the same reason heartbeat.yml is: if daily.yml's
# own cron never fires, anything living inside daily.yml is silent too.
#
# GitHub: "If the load is sufficiently high enough, some queued jobs may be
# dropped." A dropped run fails nothing, logs nothing, and sends no review —
# the day just passes. The weekly heartbeat cannot see it; a Tuesday that
# never happened would stay invisible until the next Monday.
#
# Runs at 17:07 UTC — 714 minutes after the 05:13 post window.
#
# That margin is set from OBSERVED delay, not a guess, and the observation
# has been re-taken. The original band was 210 minutes, sized against a
# delay measured in early August:
#   2026-07-30  13:30 -> 15:28   118 min
#   2026-07-31  13:30 -> 15:33   123 min
#   2026-08-03  13:37 -> 16:05   148 min   (:37 did not spare it)
# Those numbers are no longer true. Measured over 20 runs in 2026-10,
# daily.yml queues min 171 / median 259 / max 456 minutes late — so 210
# minutes is now BELOW typical. An alarm with negative headroom reports a
# late run as a missing one, and an alarm that cries wolf is worse than no
# alarm, because the next real one gets dismissed.
#
# It did not actually misfire, by luck rather than design: this alarm is
# delayed by the same scheduler it is watching (123-322 min observed), so
# its real check time drifted later in step with the thing it checks. That
# is not a margin, it is a coincidence, and it would evaporate the first
# time the two delays diverged.
#
# Moving the post to 05:13 restores the band by making it enormous: 714
# minutes, against a worst-ever observed delay of 456. The alarm's own
# delay now only adds to that. Keep the gap well clear of the measured
# maximum, not of some remembered typical — see
# test_the_alarm_runs_well_after_the_observed_delay, which enforces it.
#
# Also off the hour and off :30, per GitHub's own mitigation.

on:
  schedule:
    - cron: "7 17 * * 1-6"   # Mon–Sat, matching daily.yml's days
  workflow_dispatch:

permissions:
  actions: read           # to ask whether daily.yml ran
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Did today's run fire?
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "engine")
          import missed_run, notify

          missed, message = missed_run.check(os.environ["REPO"],
                                             os.environ["GH_TOKEN"])
          print(f"[missed-run] {message}")
          if not missed:
              sys.exit(0)

          # Loud, and actionable. A missed day is recoverable by hand — but
          # only if somebody is told.
          notify.alert(
              f":rotating_light: *No social post ran today*\n{message}\n"
              f"{os.environ['ACTIONS_URL']}")
          sys.exit(1)
          PY

      # The broader question, and the one nothing else in this repo asked:
      # has a post actually REACHED a channel lately?
      #
      # `if: always()` because the step above exits 1 on a missed day, and
      # these are independent failures — a day that was dropped AND a
      # channel that has been dark a week is exactly when you want both
      # said out loud, not one of them swallowed by the other's exit code.
      #
      # Deliberately in THIS workflow rather than daily.yml: the outage
      # this was written for was daily.yml's own concurrency group being
      # held by an unapproved run, so anything living inside daily.yml
      # would have been queued behind the failure it was meant to report.
      - name: Has a post reached a channel lately?
        if: always()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "engine")
          import stale_channel, notify

          stale, message = stale_channel.check(
              os.path.join("logs", "posted.jsonl"),
              os.environ["REPO"], os.environ["GH_TOKEN"])
          print(f"[stale-channel] {message}")
          if not stale:
              sys.exit(0)

          notify.alert(
              f":rotating_light: *The social channel has gone dark*\n"
              f"{message}\n{os.environ['ACTIONS_URL']}")
          sys.exit(1)
          PY
