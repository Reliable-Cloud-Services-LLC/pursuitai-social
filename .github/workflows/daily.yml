name: Daily social post

# Two jobs, deliberately. `prepare` builds and commits the post but cannot
# publish it; `publish` targets the `social-publish` environment, which has
# a required reviewer, so GitHub itself pauses the run until a human
# approves. That pause is the gate — it is enforced by GitHub, not by our
# code, so no env var or flag here can bypass it.

# SCHEDULE LIVE (2026-07-29). Enabled once every hold cleared: 23 of 24
# topics verified against source, X and Instagram both publishing via API
# on a never-expiring System User token, and the rotation freshness-guarded
# against repeats. LinkedIn stays manual (preview.py --linkedin) — that is
# LinkedIn's API tier, not a hold on this schedule.
#
# The cron only PREPARES. Every run still parks at the social-publish
# environment until a human approves — the schedule automates the proposal,
# never the decision. A run nobody approves simply expires; the topic is
# not consumed and comes round again.
#
# To pause: comment out the schedule block (the kill switch in the README —
# disabling the workflow in the Actions tab — also works and is faster).
on:
  schedule:
    # 13:37 UTC = 9:37 AM ET — still the B2B engagement window, but OFF the
    # half hour. GitHub: "The schedule event can be delayed during periods
    # of high loads... High load times include the start of every hour" and
    # "If the load is sufficiently high enough, some queued jobs may be
    # dropped." Their own mitigation is "schedule your workflow to run at a
    # different time of the hour". :30 is the second-busiest slot after
    # :00 — the 2026-07-30 run queued 118 minutes late on it.
    - cron: "37 13 * * 1-6"   # Mon–Sat; give Sunday a rest
  workflow_dispatch:
    inputs:
      format:
        description: >-
          Override the rotation's format for this run (preview a format
          without waiting for it to come round). Leave blank for normal
          rotation. The topic still advances, so use it sparingly.
        required: false
        type: choice
        options: ["", "card", "screenshot", "ad"]
        default: ""
      skip:
        description: >-
          Skip a channel this run. Use to re-post a topic to the channel
          that FAILED without duplicating on the one that succeeded — the
          remediation path for a single-channel outage. Leave blank
          normally.
        required: false
        type: choice
        options: ["", "x", "ig"]
        default: ""
      topic:
        description: >-
          Post THIS topic id instead of the rotation's next (e.g. a
          correction). Out-of-band: the rotation does not advance, so it
          cannot skip the topic that was actually due. Leave blank normally.
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Voice for the animated-ad format. ~1 GB, so it is cached and lives
      # in its own requirements file — the test job must never pull it.
      # torch from the CPU index: the default resolves the CUDA build, which
      # is ~2.5 GB of wheels for a GPU no runner has.
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: voice-model-${{ hashFiles('requirements-voice.txt') }}

      - name: Install voice dependencies
        timeout-minutes: 10
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-voice.txt
          # Pre-download the spaCy model misaki needs, so it does not happen
          # mid-render where a failure would lose the day's post.
          python -m spacy download en_core_web_sm || \
            echo "::warning::spaCy model unavailable — ads will be silent"

      - name: Prepare assets + captions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORMAT: ${{ inputs.format }}
          TOPIC: ${{ inputs.topic }}
        run: |
          args=""
          [ -n "$FORMAT" ] && args="$args --format $FORMAT"
          [ -n "$TOPIC" ] && args="$args --topic $TOPIC"
          python engine/run.py --prepare $args

      # Rendered media goes to object storage, not into git (W8). Instagram
      # fetches by public URL and the repo was only ever standing in as that
      # host — at the cost of growing with every run. The AWS CLI is
      # preinstalled on the runner, so this adds no dependency; R2 is
      # S3-compatible via --endpoint-url.
      - name: Upload media to object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEDIA_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_SECRET_ACCESS_KEY }}
          # R2 wants 'auto'; S3 needs a real region. Configurable so either works.
          AWS_DEFAULT_REGION: ${{ secrets.MEDIA_REGION || 'auto' }}
          BUCKET: ${{ secrets.MEDIA_BUCKET }}
          ENDPOINT: ${{ secrets.MEDIA_ENDPOINT }}
        run: |
          if [ -z "$BUCKET" ]; then
            echo "::error::MEDIA_BUCKET is not set. Rendered media is no"
            echo "::error::longer committed to the repo, so Instagram has"
            echo "::error::nowhere to fetch from. See SECRETS.md."
            exit 1
          fi
          args=""
          [ -n "$ENDPOINT" ] && args="--endpoint-url $ENDPOINT"
          # Short cache deliberately. Card filenames are STABLE per topic
          # (pipeline_ig.png) but their CONTENT changes whenever copy is
          # corrected — as it just was. A year-long max-age would have any
          # CDN or proxy serving the old, wrong card long after the fix.
          # Volume is a handful of fetches a day, so a long cache buys
          # nothing and risks exactly the staleness we cannot afford.
          aws s3 sync assets/ "s3://$BUCKET/assets/" $args \
            --no-progress --only-show-errors \
            --exclude "preview/*" --cache-control "public, max-age=300"
          echo "uploaded $(find assets -type f -not -path 'assets/preview/*' | wc -l) file(s)"

      # pending.json still commits: the publish job is a separate run that
      # may happen hours later, so the reviewed post has to persist.
      - name: Commit pending post
        run: |
          git config user.name "pursuitai-bot"
          git config user.email "bot@pursuitai.net"
          git add content/pending.json || true
          git commit -m "prepare $(date -u +%F)" || echo "nothing to commit"
          git push

      # After the push, so Slack can actually fetch the card image.
      - name: Send for review
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          REVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python engine/run.py --notify-pending

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer lives here. The job will not start until approved.
    environment: social-publish
    steps:
      # ref, not the run's SHA: the prepare job pushed pending.json and the
      # assets after this run started, and we need that commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # X uploads media BYTES (unlike Instagram, which fetches a URL), so
      # the publish job needs the files locally. They are no longer in the
      # repo, so pull them back from the bucket rather than re-rendering —
      # re-rendering could produce different pixels than what was approved.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch approved media from object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEDIA_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_SECRET_ACCESS_KEY }}
          # R2 wants 'auto'; S3 needs a real region. Configurable so either works.
          AWS_DEFAULT_REGION: ${{ secrets.MEDIA_REGION || 'auto' }}
          BUCKET: ${{ secrets.MEDIA_BUCKET }}
          ENDPOINT: ${{ secrets.MEDIA_ENDPOINT }}
        run: |
          args=""
          [ -n "$ENDPOINT" ] && args="--endpoint-url $ENDPOINT"
          aws s3 sync "s3://$BUCKET/assets/" assets/ $args \
            --no-progress --only-show-errors
          ls -la assets/cards | head -3

      # Reaching this step means a required reviewer already approved in the
      # GitHub UI. This records WHAT was approved so publish can verify the
      # content did not change in between.
      - name: Record approval
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: python engine/run.py --approve

      - name: Publish to X + Instagram
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SKIP: ${{ inputs.skip }}
        run: |
          args=""
          [ "$SKIP" = "x" ] && args="--skip-x"
          [ "$SKIP" = "ig" ] && args="--skip-ig"
          python engine/run.py --publish $args

      # always(): publish exits non-zero on failure, and the failure entry
      # in posted.jsonl is the evidence. Without this the fail-loud change
      # would erase its own audit trail.
      # The post log and rotation state are the ONLY record that a post
      # happened. Losing them means the topic is re-served later as a
      # visible duplicate — so this step must not fail quietly.
      #
      # It used to run `git pull --rebase || true`, which swallowed a real
      # failure: the media sync leaves assets/ dirty, so rebase refuses
      # ("cannot pull with rebase: You have unstaged changes"), and if
      # develop had ALSO moved the subsequent push was rejected and the log
      # was lost. It survived 2026-07-30 only because develop happened not
      # to have moved that hour.
      #
      # Now: stage ONLY the tracked state, commit, then rebase just that
      # commit onto whatever landed meanwhile, and retry the push. A push
      # that still cannot land fails the step LOUDLY.
      - name: Commit state + post log
        if: always()
        run: |
          git config user.name "pursuitai-bot"
          git config user.email "bot@pursuitai.net"
          git add -A content logs || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "post log $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/$GITHUB_REF_NAME"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" || {
              echo "::error::rebase failed — the post log could not be"
              echo "::error::saved. The rotation will re-serve this topic"
              echo "::error::and duplicate it. Fix the branch by hand."
              exit 1
            }
          done
          echo "::error::could not push the post log after 3 attempts"
          exit 1
