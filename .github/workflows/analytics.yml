name: Weekly analytics read-back

# Separate from publishing on purpose. X reads are billed under pay-per-use,
# and a metrics failure must never touch the publish path — so this runs on
# its own schedule and its own job.

on:
  schedule:
    # :41, not :00 — see heartbeat.yml. A dropped analytics run is the
    # mildest of these failures (the next week re-reads the same posts),
    # but the slot costs nothing to move.
    - cron: "41 15 * * 1"   # Mondays 11:41 ET, after the weekend settles
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Collect post metrics
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # LinkedIn read-back for the pilot, and the winner report that
          # follows collection. Both no-op when there is nothing to say.
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          PILOT_MODE: ${{ vars.PILOT_MODE || secrets.PILOT_MODE }}
        run: python engine/analytics.py

      # scripts/commit_and_push.sh, shared with daily.yml's two writers.
      # This step kept the `git pull --rebase || true` form that publish
      # replaced on 2026-07-30 for swallowing a real failure — it was the
      # last copy of a pattern already known to lose commits.
      - name: Commit metrics
        if: always()
        env:
          PUSH_FAILURE_HINT: >-
            Metrics are a read-back of posts that already happened, so a
            lost commit costs history, not a post.
        run: scripts/commit_and_push.sh "metrics $(date -u +%F)" logs/metrics.jsonl
