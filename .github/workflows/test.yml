name: Tests & credential validation

on:
  push:
    branches: [main]
    paths: ["engine/**", "content/calendar.json", "tests/**", "requirements.txt"]
  pull_request:
  workflow_dispatch:
    inputs:
      validate_credentials:
        description: "Also validate X + Instagram credentials (needs secrets)"
        type: boolean
        default: false

# A superseded push should not keep burning a runner, and a stalled
# apt mirror should not hold a PR hostage for the full job timeout.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        timeout-minutes: 4
        run: pip install -r requirements.txt pytest pytest-xdist

      # ffmpeg and the DejaVu fonts are preinstalled on the standard
      # runner image. Only reach for apt when they are genuinely missing —
      # `apt-get update` is the slowest and least reliable step in this
      # workflow, and it was stalling runs past the job timeout.
      - name: Ensure ffmpeg + fonts
        timeout-minutes: 4
        run: |
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          fc-list 2>/dev/null | grep -qi dejavu || need="$need fonts-dejavu-core"
          if [ -n "$need" ]; then
            echo "installing:$need"
            sudo apt-get update -qq && sudo apt-get install -y -qq $need
          else
            echo "ffmpeg and DejaVu fonts already present — skipping apt"
          fi

      # The suite is subprocess-heavy, so it parallelises well.
      - name: Run test suite
        timeout-minutes: 8
        run: pytest tests/ -n auto --dist loadfile -q

  validate-credentials:
    if: ${{ inputs.validate_credentials }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate X credentials
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/validate_x.py
      - name: Validate Instagram credentials + media fetch
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Validate the branch this run is dispatched from, not a
          # hardcoded one — assets are committed to the default branch.
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python scripts/validate_ig.py --container
